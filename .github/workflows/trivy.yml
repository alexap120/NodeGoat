name: Trivy Scan

on:
  workflow_dispatch:

jobs:
  security:
    # Jumping the jammed Ubuntu queue completely by switching to macOS hardware
    runs-on: macos-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Trivy via Homebrew
        run: |
          brew install trivy

      - name: Run Trivy Scan (console output)
        run: |
          trivy fs --severity HIGH,CRITICAL --format table .
